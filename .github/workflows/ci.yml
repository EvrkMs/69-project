name: CI

on:
  push:
  pull_request:

# least privilege: the workflow can only read the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # no `npm install`: the project has no dependencies, which is part of its security story
      - run: npm run validate
      - run: npm test
      - name: Assert the project still has zero runtime dependencies
        run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length) { console.error('dependencies found'); process.exit(1) }"
